<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="روابط Layeer الشخصية: تيليجرام وتيك توك" />
  <meta property="og:title" content="Layeer | Links" />
  <meta property="og:description" content="كل روابط حساباتي في صفحة واحدة" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0f1020" />
  <title>Layeer | Links</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080914;
      --card: rgba(255, 255, 255, 0.09);
      --card-border: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --soft: rgba(255, 255, 255, 0.12);
      --glow: rgba(132, 70, 255, 0.45);
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(132, 70, 255, 0.38), transparent 30%),
        radial-gradient(circle at 80% 0%, rgba(0, 210, 255, 0.24), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(255, 49, 130, 0.20), transparent 35%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .glow {
      position: absolute;
      inset: 18px;
      background: var(--glow);
      filter: blur(70px);
      border-radius: 44px;
      z-index: -1;
      opacity: 0.9;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 30px 22px 24px;
      backdrop-filter: blur(18px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 1px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06)),
        linear-gradient(135deg, #7c3cff, #00d2ff);
      border: 1px solid rgba(255, 255, 255, 0.30);
      box-shadow: 0 18px 45px rgba(0,0,0,0.35);
      direction: ltr;
    }

    h1 {
      font-size: 34px;
      line-height: 1.1;
      margin-bottom: 8px;
      direction: ltr;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .links {
      display: grid;
      gap: 13px;
      margin-top: 10px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.105);
      border: 1px solid rgba(255, 255, 255, 0.16);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .link:hover {
      transform: translateY(-3px) scale(1.01);
      background: rgba(255, 255, 255, 0.17);
      border-color: rgba(255, 255, 255, 0.32);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--soft);
      font-size: 22px;
      flex: 0 0 auto;
    }

    .info strong {
      display: block;
      font-size: 16px;
      margin-bottom: 3px;
    }

    .info span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
      text-align: right;
    }

    .arrow {
      opacity: 0.74;
      font-size: 20px;
      direction: ltr;
    }

    .footer {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.13);
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      direction: ltr;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.80);
      font-size: 13px;
      margin-bottom: 18px;
      direction: ltr;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #24ff94;
      box-shadow: 0 0 18px rgba(36, 255, 148, 0.85);
    }

    @media (max-width: 420px) {
      .card { padding: 26px 16px 20px; border-radius: 26px; }
      h1 { font-size: 30px; }
      .avatar { width: 88px; height: 88px; font-size: 38px; }
      .link { padding: 13px 13px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="glow"></div>
    <section class="card" aria-label="روابط Layeer الشخصية">
      <div class="avatar">L</div>
      <div class="badge"><span class="dot"></span> layeer.dev</div>
      <h1>Layeer</h1>
      <p class="subtitle">روابط حساباتي الشخصية في مكان واحد</p>

      <nav class="links" aria-label="روابط الحسابات">
        <a class="link" href="https://t.me/T_7_P" target="_blank" rel="noopener noreferrer">
          <span class="left">
            <span class="icon">✈️</span>
            <span class="info">
              <strong>Telegram</strong>
              <span>@T_7_P</span>
            </span>
          </span>
          <span class="arrow">↗</span>
        </a>

        <a class="link" href="https://www.tiktok.com/@14sc" target="_blank" rel="noopener noreferrer">
          <span class="left">
            <span class="icon">♪</span>
            <span class="info">
              <strong>TikTok</strong>
              <span>@14sc</span>
            </span>
          </span>
          <span class="arrow">↗</span>
        </a>
      </nav>

      <p class="footer">© <span id="year"></span> Layeer. All rights reserved.</p>
    </section>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
