<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="روابط Layeer الشخصية: تيليجرام وتيك توك" />
  <meta property="og:title" content="Layeer | Links" />
  <meta property="og:description" content="روابط حساباتي الشخصية" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Layeer | Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0f14;
      --card: #111821;
      --card-soft: #151f2b;
      --border: #223044;
      --text: #eef4ff;
      --muted: #91a1b6;
      --accent: #7aa2ff;
      --accent-soft: rgba(122, 162, 255, 0.12);
    }

    body {
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(122, 162, 255, 0.10), transparent 34%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    .page {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 20px 20px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
    }

    .avatar {
      width: 84px;
      height: 84px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      border: 1px solid rgba(122, 162, 255, 0.28);
      color: var(--accent);
      font-size: 36px;
      font-weight: 800;
      direction: ltr;
    }

    .domain {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--card-soft);
      border: 1px solid var(--border);
      font-size: 13px;
      direction: ltr;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #80d6a3;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
      direction: ltr;
    }

    .subtitle {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .links {
      display: grid;
      gap: 12px;
      text-align: right;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
      background: var(--card-soft);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #182331;
      border-color: rgba(122, 162, 255, 0.42);
    }

    .link-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--accent);
    }

    .icon svg {
      width: 23px;
      height: 23px;
      display: block;
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
      font-weight: 700;
    }

    .info span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
      text-align: right;
    }

    .arrow {
      color: var(--muted);
      font-size: 19px;
      direction: ltr;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      color: #6f7f94;
      font-size: 12px;
      direction: ltr;
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 16px 18px;
        border-radius: 22px;
      }

      h1 {
        font-size: 29px;
      }

      .avatar {
        width: 78px;
        height: 78px;
        font-size: 33px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="روابط Layeer الشخصية">
      <div class="avatar">L</div>
      <div class="domain"><span class="status-dot"></span> layeer.dev</div>

      <h1>Layeer</h1>
      <p class="subtitle">روابط حساباتي الشخصية في مكان واحد</p>

      <nav class="links" aria-label="روابط الحسابات">
        <a class="link" href="https://t.me/T_7_P" target="_blank" rel="noopener noreferrer">
          <span class="link-main">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M21.7 4.3c.3-1.1-.8-2-1.8-1.6L2.6 9.4c-1.2.5-1.2 2.2.1 2.5l4.4 1.4 1.7 5.5c.4 1.2 1.9 1.5 2.7.5l2.5-3 4.8 3.5c.9.7 2.2.2 2.4-.9L21.7 4.3ZM8 12.4l9.6-5.9c.4-.2.8.3.5.6l-7.9 7.1-.3 3.1-1.2-4.1c-.1-.4-.4-.7-.7-.8Z"/>
              </svg>
            </span>
            <span class="info">
              <strong>Telegram</strong>
              <span>@T_7_P</span>
            </span>
          </span>
          <span class="arrow">↗</span>
        </a>

        <a class="link" href="https://www.tiktok.com/@14sc" target="_blank" rel="noopener noreferrer">
          <span class="link-main">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.2 3c.3 2.4 1.7 4 4.1 4.2v3.4c-1.5 0-2.9-.5-4.1-1.3v5.9c0 3.4-2.2 5.8-5.5 5.8-3 0-5.2-2.1-5.2-5 0-3.2 2.6-5.3 5.8-5.1v3.5c-1.4-.3-2.5.5-2.5 1.6 0 1 .8 1.7 1.8 1.7 1.3 0 2.1-.8 2.1-2.5V3h3.5Z"/>
              </svg>
            </span>
            <span class="info">
              <strong>TikTok</strong>
              <span>@14sc</span>
            </span>
          </span>
          <span class="arrow">↗</span>
        </a>
      </nav>

      <p class="footer">© <span id="year"></span> Layeer</p>
    </section>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
